name: Build and Release Dynamic Island

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, Package & Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore DynamicIsland.csproj

      - name: Publish Single-File Release
        run: >
          dotnet publish DynamicIsland.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:PublishReadyToRun=true
          -o ./publish

      - name: Create Portable ZIP Archive
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath ./DynamicIsland-Windows-x64.zip -Force

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Inno Setup Installer
        run: |
          New-Item -ItemType Directory -Force -Path "./publish_installer"
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
              & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/setup.iss /O./publish_installer /FDynamicIsland-Setup-v1.0.0
          } else {
              ISCC.exe installer/setup.iss /O./publish_installer /FDynamicIsland-Setup-v1.0.0
          }

      - name: Generate Release Tag
        id: vars
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Dynamic Island ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            DynamicIsland-Windows-x64.zip
            publish_installer/DynamicIsland-Setup-v1.0.0.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
